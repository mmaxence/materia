<!doctype html><html lang="en"><meta charset="utf-8"><title>Living Type performance bench</title><style>body{margin:32px;background:#0b111c;color:#dce7f7;font:14px system-ui}.host{width: min(800px,90vw);height:240px;position:relative;display:grid;place-items:center}h1{font-size:64px}pre{white-space:pre-wrap}button{padding:12px}</style><h2>Living Type performance bench</h2><p>Local browser measurements, no network or CPU throttling. Frame intervals measure browser scheduling, not GPU execution. Update latency is API call to next animation frame, not input-to-photon.</p><button id="run">Run benchmark</button><div class="host"><h1>Beyond static.</h1></div><pre id="result">Ready</pre><script type="module">
import {createTextEffect} from '../lib/index.js';
import {stack} from '../lib/stack.js';
import {accordion} from '../lib/geometry/accordion.js';
import {dither} from '../lib/signal/dither.js';
import {rgbSplit} from '../lib/signal/rgbSplit.js';
const frame=()=>new Promise(r=>requestAnimationFrame(r));
const stats=a=>{a.sort((a,b)=>a-b);return {median:+a[Math.floor(a.length*.5)].toFixed(2),p95:+a[Math.min(a.length-1,Math.floor(a.length*.95))].toFixed(2)}};
document.querySelector('#run').onclick=async()=>{
const out=document.querySelector('#result'),button=document.querySelector('#run');button.disabled=true;out.textContent='Running…';
try{
await document.fonts.ready;
const report={date:new Date().toISOString(),userAgent:navigator.userAgent,dpr:devicePixelRatio,viewport:[innerWidth,innerHeight],host:[document.querySelector('.host').clientWidth,240],samples:120,warmupFrames:30,results:[]};
for(const count of [1,3,6]){
const layers=Array.from({length:count},(_,i)=>({effect:[accordion,dither,rgbSplit][i%3],strength:.4,scale:8}));
const mounts=[];let fx;
for(let i=0;i<5;i++){const t=performance.now();fx=createTextEffect(document.querySelector('h1'),{effect:stack(layers),auto:true});mounts.push(performance.now()-t);if(!fx.supported)throw Error('WebGL unsupported');await frame();if(i<4)fx.destroy();}
for(let i=0;i<30;i++)await frame();
const intervals=[];let previous=await frame();for(let i=0;i<120;i++){const now=await frame();intervals.push(now-previous);previous=now;}
const latency=[],calls=[];for(let i=0;i<30;i++){await frame();const start=performance.now();fx.setLayer(0,{strength:i%2?.4:.5});calls.push(performance.now()-start);await frame();latency.push(performance.now()-start);}
report.results.push({layers:count,mountMs:stats(mounts),frameIntervalMs:stats(intervals),over25ms:intervals.filter(x=>x>25).length,updateCallMs:stats(calls),updateToFrameMs:stats(latency)});fx.destroy();
}
const nav=performance.getEntriesByType('navigation')[0];report.navigation={domContentLoadedMs:+nav.domContentLoadedEventEnd.toFixed(1),loadMs:+nav.loadEventEnd.toFixed(1),transferBytes:performance.getEntriesByType('resource').reduce((s,r)=>s+r.transferSize,nav.transferSize)};
out.textContent=JSON.stringify(report,null,2);
}catch(e){out.textContent='FAILED: '+e.stack;}finally{button.disabled=false;}
};</script></html>
